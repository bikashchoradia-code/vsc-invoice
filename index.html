<script>

document.addEventListener("DOMContentLoaded", function() {

// ===== GET ELEMENTS =====
const taxableInput = document.getElementById("taxableInput");
const gstAmt = document.getElementById("gstAmt");
const invoiceAmt = document.getElementById("invoiceAmt");
const taxableTotal = document.getElementById("taxableTotal");
const gstTotal = document.getElementById("gstTotal");
const grandTotal = document.getElementById("grandTotal");
const narration = document.getElementById("narration");
const branch = document.getElementById("branch");
const invNo = document.getElementById("invNo");
const dateDisplay = document.getElementById("dateDisplay");
const date = document.getElementById("date");

// ===== CALC =====
function calc(){
let val = parseFloat(taxableInput.value)||0;
let gst = val * 0.18;
let total = val + gst;

gstAmt.innerText = gst.toFixed(2);
invoiceAmt.innerText = total.toFixed(2);

taxableTotal.innerText = val.toFixed(2);
gstTotal.innerText = gst.toFixed(2);
grandTotal.innerText = total.toFixed(2);
}

if(taxableInput){
taxableInput.addEventListener("input", calc);
}

// ===== AUTO RESIZE =====
function autoResize(){
if(!narration) return;
narration.style.height = "auto";
narration.style.height = narration.scrollHeight + "px";
}

if(narration){
narration.addEventListener("input", autoResize);
narration.addEventListener("paste", autoResize);
setTimeout(autoResize, 100);
}

// ===== DATE =====
if(dateDisplay && date){
dateDisplay.addEventListener("focus", ()=>date.showPicker());

date.addEventListener("change", ()=>{
let d = new Date(date.value);
dateDisplay.value = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
});
}

// ===== VALIDATION =====
function validate(){
let valid=true;

[branch, invNo, dateDisplay, narration, taxableInput].forEach(el=>{
if(!el) return;
el.classList.remove("error");
if(!el.value){
el.classList.add("error");
valid=false;
}
});

if(invNo && !invNo.value.startsWith("VSC/2627/")){
alert("Invoice must start with VSC/2627/");
return false;
}

return valid;
}

// ===== CLEAN FILE NAME =====
function cleanFileName(name){
return name.replace(/[\\\/:*?"<>|]/g, '').trim();
}

// ===== PDF =====
window.generate = function(preview){

if(!validate()) return;

let btn = document.querySelector(".no-print");
if(btn) btn.style.display="none";

let element = document.getElementById('invoice-root');

// FILE NAME
let inv = invNo ? invNo.value.split('/').pop().trim() : "Bill";
let narrationText = narration ? narration.value.trim() : "";

let fileName = cleanFileName(`Bill No. ${inv} ${narrationText || 'Invoice'}.pdf`);

let opt = {
margin:10,
html2canvas:{scale:2},
jsPDF:{unit:"mm",format:"a4"}
};

if(preview){
html2pdf().set(opt).from(element).toPdf().output('datauristring').then(uri=>{
window.open(uri);
if(btn) btn.style.display="block";
});
}else{
html2pdf().set(opt).from(element).toPdf().output('blob').then(blob=>{
let link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = fileName;
link.click();
if(btn) btn.style.display="block";
});
}
}

window.downloadPDF = function(){ generate(false) }
window.previewPDF = function(){ generate(true) }

});

</script>
